services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myclub-portal
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://myclub:myclub@db:5433/myclub?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: myclub-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=myclub
      - POSTGRES_PASSWORD=myclub
      - POSTGRES_DB=myclub
    volumes:
      - myclub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myclub -d myclub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  myclub-db-data:
